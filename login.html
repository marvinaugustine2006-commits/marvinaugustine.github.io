<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enter My Love World ❤️</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>💖</span>
        <span>💗</span>
        <span>❤️</span>
        <span>💘</span>
        <span>💓</span>
        <span>💞</span>
    </div>

    <div class="login-card">

        <div class="heart">💖</div>

        <h1>Welcome, My Love!</h1>

        <p class="subtitle">
            Your special surprise is waiting for you. 💌
        </p>

        <form action="dashboard.html" method="get">

            <label for="name">Your Beautiful Name</label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >

            <label for="email">Your Email Address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="password">Your Secret Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter any password"
                autocomplete="current-password"
                minlength="4"
                required
            >

            <button type="submit">
                Enter My Love World ❤️
            </button>

        </form>

        <p class="note">
            Don't worry, beautiful. Something special awaits you! 🌹
        </p>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>

    </div>

</body>
</html>
